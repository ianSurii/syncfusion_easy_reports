name: Deploy GitHub Pages Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Package & Example Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Build Web Application
        run: |
          cd example
          flutter build web --release --base-href "/syncfusion_easy_reports/"

      - name: Prepare Pages Artifacts
        run: |
          # Disable Jekyll processing on GitHub Pages to serve canvaskit, fonts, and assets properly
          touch example/build/web/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'example/build/web/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
